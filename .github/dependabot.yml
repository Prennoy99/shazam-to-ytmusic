version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: pip
    directory: /backfill
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies"]
