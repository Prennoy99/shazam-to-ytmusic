version: 2

# Major-version bumps are ignored across the board: for a project this size they
# are migrations, not updates (AGP 8->9 needs a Gradle wrapper bump in the same
# commit, Kotlin 1.9->2.x needs a compiler migration, OkHttp 4->5 changes APIs),
# and Dependabot can't coordinate them across separate PRs. Do those by hand,
# deliberately. Minor and patch updates still arrive automatically.

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      backend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backfill
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      backfill-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      android-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # appcompat 1.8.0+ ships Kotlin 2.1 metadata, which the pinned Kotlin
      # 1.9 compiler cannot read ("incompatible version of Kotlin ... expected
      # 1.9.0"). Unpin this once the project migrates to Kotlin 2.x.
      - dependency-name: "androidx.appcompat:appcompat"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
